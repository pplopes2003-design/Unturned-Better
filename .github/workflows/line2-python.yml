name: Line 2 Python checks

on:
  push:
    branches:
      - line2/modpack-framework
    paths:
      - 'Line2-Modpack/AIService/**'
      - 'Line2-Modpack/ModpackManager/**'
      - '.github/workflows/line2-python.yml'
  pull_request:
    paths:
      - 'Line2-Modpack/AIService/**'
      - 'Line2-Modpack/ModpackManager/**'
      - '.github/workflows/line2-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile AI service
        working-directory: Line2-Modpack/AIService
        run: python -m compileall -q .
      - name: Test AI service
        working-directory: Line2-Modpack/AIService
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Compile manager
        working-directory: Line2-Modpack/ModpackManager
        run: python -m compileall -q .
      - name: Test manager
        working-directory: Line2-Modpack/ModpackManager
        run: python -m unittest discover -s . -p "test_*.py" -v
