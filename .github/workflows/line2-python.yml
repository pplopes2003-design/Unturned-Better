name: Line 2 Windows Python checks

on:
  push:
    branches: [line2/modpack-framework]
    paths:
      - 'Line2-Modpack/AIService/**'
      - 'Line2-Modpack/ModpackManager/**'
      - 'Line2-Modpack/ClientModule/**'
      - 'Line2-Modpack/BrainTests/**'
      - 'Line2-Modpack/check_sdk_api_surface.py'
      - 'Line2-Modpack/run_tests.py'
      - '.github/workflows/line2-python.yml'
  pull_request:
    paths:
      - 'Line2-Modpack/AIService/**'
      - 'Line2-Modpack/ModpackManager/**'
      - 'Line2-Modpack/ClientModule/**'
      - 'Line2-Modpack/BrainTests/**'
      - 'Line2-Modpack/check_sdk_api_surface.py'
      - 'Line2-Modpack/run_tests.py'
      - '.github/workflows/line2-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m compileall -q Line2-Modpack
      - name: Verify checked-in U3 SDK symbols (not a C# build)
        run: python Line2-Modpack/check_sdk_api_surface.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test native C# NPC decision brain (standalone)
        run: dotnet run --project Line2-Modpack/BrainTests/BrainTests.csproj --configuration Release
      - name: Test AI Service
        run: python Line2-Modpack/run_tests.py AIService
      - name: Test Modpack Manager
        if: always()
        run: python Line2-Modpack/run_tests.py ModpackManager
      - name: Print concise test failure details
        if: always()
        run: |
          foreach ($suite in @("AIService", "ModpackManager")) {
            $report = "Line2-Modpack/test-results/$suite-unittest.txt"
            if (Test-Path $report) {
              $lines = @(Get-Content $report)
              $problem = @($lines | Select-String -Pattern "^FAIL:|^ERROR:|^FAILED \(|^Traceback|^SyntaxError|^ImportError|^ModuleNotFoundError")
              Write-Host "=== $suite test report: $($problem.Count) failure markers ==="
              if ($problem.Count -gt 0) {
                Get-Content $report -Tail 80 | Write-Host
              } else {
                Get-Content $report -Tail 5 | Write-Host
              }
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### $suite"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '~~~text'
              Get-Content $report -Tail 45 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '~~~'
            } else {
              Write-Warning "$suite report is absent (test step may not have started)."
            }
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line2-windows-test-results
          path: Line2-Modpack/test-results/
          if-no-files-found: warn
          retention-days: 14
